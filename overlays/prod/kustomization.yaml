apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO(aluno): troque cicd-prod pelo seu projeto de producao ($PROD_NS).
namespace: cicd-prod-rafael-campos

resources:
  - ../../base

# Producao NAO e construida: usa a MESMA imagem de dev, identificada pelo digest.
# O digest (e APP_VERSION) so mudam por pull request de promocao (config/scripts/promover.sh).
# TODO(aluno): em newName, troque cicd-dev pelo seu projeto de DESENVOLVIMENTO ($DEV_NS),
# porque e la que o pipeline publica a imagem.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-rafael-campos/luz-bairro
    digest: sha256:1182cda45f9920d2cc7f5c9e6b28dba46407c09a0f9d0302b44fc5bb10dbc1f5

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - PRODUCAO
      - APP_ENV=prod
      - APP_VERSION=ae5393e

patches:
  - target:
      kind: Deployment
      name: luz-bairro
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
